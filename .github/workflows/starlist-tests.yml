name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'schemas/starlist/**'
      - '.github/workflows/starlist-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'schemas/starlist/**'
      - '.github/workflows/starlist-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: schemas/starlist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        run: uv run pytest

  schema-files:
    # Guard the archived schema versions. Only meaningful for PRs, where there
    # is a base ref. Stale generated files are caught by pytest in the test job.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schemas/starlist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check archived schema files are unchanged
        # aavso_starlist_schema_data/v<version>/ is the permanent record of each
        # schema version, and aavso_starlist_schema_data/legacy/ of the schema
        # before versioning began. A PR
        # may add an archive but never modify, delete or rename one
        # (--diff-filter=a is every kind of change except an addition).
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --exit-code --name-only --diff-filter=a \
            origin/${{ github.base_ref }}... -- \
            'aavso_starlist_schema_data/v*' aavso_starlist_schema_data/legacy
