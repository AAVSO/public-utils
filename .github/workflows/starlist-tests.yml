name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'schemas/starlist/**'
      - '.github/workflows/starlist-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'schemas/starlist/**'
      - '.github/workflows/starlist-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: schemas/starlist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        run: uv run pytest
